<!-- Assumptions: 深色半透明 macOS 材质；单一紫色强调色；示例数据为占位；关键流程为菜单栏入口、认证、多 GitLab 实例、CI 阶段和日志。 -->
<style>
:root{--bg:#0a0f1a;--panel:#131c2c;--panel2:#1d2940;--line:rgba(187,201,229,.16);--line2:rgba(187,201,229,.3);--text:#f4f6fb;--muted:#9aa8bd;--accent:#8877ff;--accent2:#b9b0ff;--green:#64d88b;--amber:#f1b949;--red:#ff6d76;--blue:#73aaff;--shadow:0 28px 90px rgba(0,0,0,.5);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif;color:var(--text)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(800px 540px at 85% 2%,#33477655,transparent 65%),radial-gradient(700px 500px at 0 100%,#25406433,transparent 70%),var(--bg);color:var(--text);overflow-x:hidden}button{font:inherit;color:inherit;border:0;cursor:pointer}
.desktop{min-height:100vh;padding:18px 32px}.menubar{height:36px;max-width:1120px;margin:auto;display:flex;align-items:center;justify-content:space-between;color:#dfe5f1;font-size:13px}.menuleft,.menuright{display:flex;align-items:center;gap:20px}.menuright{gap:14px;color:#c6cfdf}.apple{font-size:17px}.menuitem{opacity:.84}.menuitem.strong{opacity:1;font-weight:600}.clock{font-variant-numeric:tabular-nums}.trigger{width:34px;height:30px;border-radius:9px;background:#7689b42e;box-shadow:inset 0 0 0 1px #ccd8f51f;display:grid;place-items:center;transition:.2s}.trigger.active,.trigger:hover{background:#8877ff55;box-shadow:inset 0 0 0 1px #b9b0ff88}
.stack{width:20px;height:18px;position:relative;display:inline-block}.stack i{position:absolute;left:1px;width:18px;height:7px;border:2px solid var(--accent2);border-radius:3px;transform:skewY(-24deg)}.stack i:nth-child(1){top:0}.stack i:nth-child(2){top:5px;opacity:.8}.stack i:nth-child(3){top:10px;opacity:.62}
.stage{max-width:1120px;min-height:calc(100vh - 72px);margin:auto;display:grid;place-items:center;color:#dce6fa77;text-align:center}.stage h1{font-size:18px;font-weight:500;color:#eef3ffad;margin:0 0 8px}.stage p{line-height:1.7;margin:0;font-size:14px}
.panel{position:fixed;z-index:10;top:61px;right:max(20px,calc((100vw - 1120px)/2));width:470px;max-height:calc(100vh - 82px);overflow:auto;padding:18px;border:1px solid #c8d2ec45;border-radius:22px;background:linear-gradient(145deg,#222d42f5,#0d1421f5);box-shadow:var(--shadow);backdrop-filter:blur(28px) saturate(1.2);animation:pop .18s ease-out}.panel:before{content:"";position:absolute;top:-8px;right:118px;width:16px;height:16px;background:#243047;transform:rotate(45deg);border-left:1px solid #c8d2ec45;border-top:1px solid #c8d2ec45}@keyframes pop{from{opacity:0;transform:translateY(-5px) scale(.985)}to{opacity:1;transform:none}}
.head{display:flex;justify-content:space-between;align-items:flex-start;padding:2px 4px 16px}.brand{display:flex;gap:11px;align-items:center}.brand .stack{transform:scale(1.13);margin-left:2px}.brand h2{font-size:19px;letter-spacing:-.02em;margin:0}.brand p{font-size:12px;color:var(--muted);margin:4px 0 0}.health{font-size:12px;color:#ccd5e5;padding-top:7px;display:flex;gap:7px;align-items:center}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:#6d7b93;box-shadow:0 0 0 3px #9aa7bd12}.dot.green{background:var(--green);box-shadow:0 0 0 3px #63d68b18}.dot.amber{background:var(--amber);box-shadow:0 0 0 3px #f3bb4c18}.dot.red{background:var(--red);box-shadow:0 0 0 3px #ff6b7318}.dot.blue{background:var(--blue)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:3px;border:1px solid var(--line);border-radius:12px;margin-bottom:16px}.tab{padding:8px;border-radius:9px;background:transparent;color:var(--muted);font-size:12px}.tab.active{background:#8b97b559;color:#fff;box-shadow:inset 0 0 0 1px #c8d2ec2e}.section-title{display:flex;justify-content:space-between;margin:16px 4px 9px;font-size:13px;font-weight:600}.section-title small{color:#6d7b93;font-weight:400}
.project,.ci,.setting{border:1px solid var(--line);border-radius:15px;background:#1219278f;overflow:hidden;margin-bottom:10px}.projecthead{display:flex;align-items:center;gap:11px;padding:12px;cursor:pointer}.projecthead:hover,.servicerow:hover,.stage-row:hover{background:#ffffff08}.projecticon{width:34px;height:34px;border-radius:10px;background:#6353d8;display:grid;place-items:center;font-weight:700}.projecticon.amber{background:#b97816}.projectmeta{flex:1}.projectname{font-size:14px;font-weight:600}.projectsub{font-size:11px;color:var(--muted);margin-top:3px}.state{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:11px;white-space:nowrap}.chev{color:var(--muted);transition:.2s}.chev.open{transform:rotate(180deg)}.services{padding:0 8px 8px}.servicerow{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 8px;border-top:1px solid #b4c2dc1a}.servicename{font-size:13px}.command,.url{color:var(--muted);font-size:11px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.url{color:#aab8d0}.actions{display:flex;gap:5px}.iconbtn,.outline,.primary{border:1px solid var(--line2);border-radius:9px;background:#8795b21f;transition:.18s}.iconbtn{width:31px;height:30px;display:grid;place-items:center;color:#d5deed}.iconbtn:hover,.outline:hover{background:#8877ff38;border-color:#b9b0ff85}.primary{background:var(--accent);border-color:transparent;padding:9px 14px;font-size:12px;font-weight:600;box-shadow:0 7px 16px #6353d84a}.primary:hover{background:#9b8eff}.outline{padding:8px 12px;font-size:12px}.quick{display:flex;gap:8px}.quick .primary{flex:1}
.ci{padding:13px}.citop{display:flex;align-items:center;justify-content:space-between}.provider{display:flex;gap:9px;align-items:center}.logo{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:11px;font-weight:700;background:#202b40}.logo.gl{color:#ff9755}.pname{font-size:13px;font-weight:600}.repo{font-size:11px;color:var(--muted);margin-top:3px}.badge{display:inline-flex;gap:5px;align-items:center;padding:4px 7px;border-radius:999px;font-size:10px}.success{color:var(--green);background:#63d68b1f}.failed{color:var(--red);background:#ff6b731f}.running{color:var(--blue);background:#73aaff1f}.cisummary{display:flex;justify-content:space-between;align-items:flex-end;padding:13px 0 5px}.cititle{font-size:15px;font-weight:600}.branch,.time{font-size:11px;color:var(--muted);margin-top:4px}.time{text-align:right;line-height:1.6}.instswitch{display:flex;gap:6px;overflow:auto;margin:13px 0 3px}.chip{flex:0 0 auto;padding:6px 9px;border:1px solid var(--line);border-radius:999px;color:var(--muted);background:transparent;font-size:11px}.chip.active{color:#fff;border-color:#b9b0ff85;background:#8877ff33}.stages{border-top:1px solid #b4c2dc1a;margin-top:10px}.stage-row{display:grid;grid-template-columns:12px minmax(0,1fr) auto 14px;gap:8px;align-items:center;padding:9px 2px;border-bottom:1px solid #b4c2dc12;cursor:pointer}.stage-row:last-child{border:0}.stage-name{font-size:12px}.duration{font-size:10px;color:var(--muted)}.stage-log{grid-column:2/-1;border-radius:9px;background:#0b101a;color:#a6b3c9;padding:8px 10px;font:10px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:normal}
.settinghead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px}.settinghead .provider{flex:1}.settingbody{padding:0 13px 13px;border-top:1px solid #b4c2dc1a}.field{margin-top:11px}.field label{display:block;color:var(--muted);font-size:10px;margin-bottom:5px}.input{width:100%;padding:8px 9px;border:1px solid var(--line2);border-radius:8px;background:#060a111f;color:#eaf0fb;outline:none;font-size:12px}.input:focus{border-color:#b9b0ffaa;box-shadow:0 0 0 3px #8877ff1f}.settingfoot{display:flex;justify-content:flex-end;gap:7px;margin-top:12px}.notice{margin-top:8px;padding:9px 10px;border-radius:9px;background:#73aaff1a;color:#afc9f7;font-size:11px;line-height:1.5}.modalback{position:fixed;inset:0;z-index:30;background:#02050a99;backdrop-filter:blur(7px);display:grid;place-items:center;padding:20px}.modal{width:min(620px,100%);max-height:calc(100vh - 40px);overflow:auto;border:1px solid #c8d2ec40;border-radius:20px;background:#131b2a;box-shadow:var(--shadow);animation:pop .16s ease-out}.modalhead{display:flex;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}.modalhead h3{margin:0;font-size:17px}.modalhead p{margin:5px 0 0;color:var(--muted);font-size:11px}.close{width:28px;height:28px;border-radius:8px;background:transparent;color:var(--muted);font-size:19px}.close:hover{background:#fff1;color:#fff}.modalbody{padding:16px 20px 20px}.pills{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}.pill{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#fff004}.pill.active{border-color:#b9b0ff8c;background:#8877ff21}.pill strong{font-size:11px}.pill span{display:block;margin-top:4px;color:var(--muted);font-size:10px}.logtoolbar{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:10px}.logbox{min-height:240px;padding:14px;border:1px solid var(--line);border-radius:12px;background:#090e17;color:#b9c5da;font:11px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace}
@media(max-width:700px){.desktop{padding:14px 12px}.menuleft{gap:10px}.menuitem:nth-child(n+3){display:none}.panel{left:10px;right:10px;top:53px;width:auto;max-height:calc(100vh - 65px)}.panel:before{right:79px}.stage{min-height:520px}}.pill{background:#ffffff04}
</style></head>
<body><main class="desktop"><header class="menubar"><div class="menuleft"><span class="apple">●</span><span class="menuitem strong">Finder</span><span class="menuitem">File</span><span class="menuitem">Edit</span><span class="menuitem">View</span><span class="menuitem">Window</span></div><div class="menuright"><span>⌁</span><span>◔</span><span>▱</span><span>⌕</span><span class="clock">Wed Apr 23&nbsp; 10:24 AM</span><button id="trigger" class="trigger active" aria-label="打开 StackHub"><span class="stack"><i></i><i></i><i></i></span></button></div></header><section class="stage"><div><h1>StackHub 菜单栏原型</h1><p>点击右上角 StackHub 图标打开面板。<br>用于走查认证、CI 阶段和日志查看流程。</p></div></section><div id="app"></div></main>
<script>
const S={open:true,tab:'projects',projects:{glint:true,applyd:false},instance:'gitlab',stage:'test',modal:null,provider:'gitlab',instances:[{id:'gitlab',name:'GitLab.com',host:'gitlab.com',project:'applyd / app'},{id:'corp',name:'公司 GitLab',host:'gitlab.intra.example.com',project:'platform / deploy'}]};
const I={play:'▶',stop:'■',restart:'↻',open:'↗',settings:'⚙',plus:'+'}; const $=s=>document.querySelector(s); const safe=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function dot(c){return '<span class="dot '+c+'"></span>'} function service(c,n,cmd,url,start){return '<div class="servicerow">'+dot(c)+'<div><div class="servicename">'+n+'</div><div class="command">'+cmd+'</div><div class="url">'+url+'</div></div><div class="actions"><button class="iconbtn" data-a="open">'+I.open+'</button><button class="iconbtn" data-a="restart">'+I.restart+'</button><button class="iconbtn" data-a="toggle">'+(start?I.play:I.stop)+'</button></div></div>'}
function project(id,name,letter,sub,state,tone,rows){return '<article class="project"><div class="projecthead" data-a="project" data-id="'+id+'"><div class="projecticon '+(tone?'amber':'')+'">'+letter+'</div><div class="projectmeta"><div class="projectname">'+name+'</div><div class="projectsub">'+sub+'</div></div><div class="state">'+dot(tone?'amber':'green')+state+'</div><span class="chev '+(S.projects[id]?'open':'')+'">⌄</span></div>'+(S.projects[id]?'<div class="services">'+rows+'</div>':'')+'</article>'}
function projects(){return '<div class="section-title"><span>Projects</span><small>2 projects · 5 services</small></div>'+project('glint','Glint','G','3 services running','Healthy','',service('green','frontend','pnpm dev','http://localhost:3000')+service('green','backend','docker compose up','http://localhost:8080')+service('green','worker','pnpm worker','http://localhost:3001'))+project('applyd','ApplyD','A','2 services running','Issues','amber',service('green','web','pnpm dev','http://localhost:5173')+service('red','api','pnpm start','http://localhost:4000',true))+'<div class="section-title"><span>Quick actions</span></div><div class="quick"><button class="primary" data-a="startall">'+I.play+'&nbsp; Start all</button><button class="outline" data-a="glint">'+I.open+'&nbsp; Open in Glint</button></div>'}
function ci(){let ins=S.instances.find(x=>x.id===S.instance)||S.instances[0];let ss=[['build','Build','1m 08s','green'],['test','Test','48s','green'],['deploy','Deploy','—','red']];return '<div class="section-title"><span>CI Activity</span><small>Last 24 hours&nbsp; ›</small></div><div class="instswitch">'+S.instances.map(x=>'<button class="chip '+(x.id===S.instance?'active':'')+'" data-a="instance" data-id="'+x.id+'">'+safe(x.name)+'</button>').join('')+'<button class="chip" data-tab="settings">'+I.plus+' Add instance</button></div><div class="ci"><div class="citop"><div class="provider"><div class="logo">GH</div><div><div class="pname">GitHub Actions</div><div class="repo">glint / main · 4m ago</div></div></div><span class="badge success">'+dot('green')+'Success</span></div><div class="cisummary"><div><div class="cititle">Build & Test</div><div class="branch">commit 8f4c2a1 · chenbstack</div></div><div class="time">2m 14s<br><button class="outline" data-a="pipeline" data-p="github">View run</button></div></div></div><div class="ci"><div class="citop"><div class="provider"><div class="logo gl">GL</div><div><div class="pname">GitLab CI · '+safe(ins.name)+'</div><div class="repo">'+safe(ins.project)+' · main · 17m ago</div></div></div><span class="badge failed">'+dot('red')+'Failed</span></div><div class="cisummary"><div><div class="cititle">Deploy pipeline</div><div class="branch">commit 21d7bc0 · release/1.6</div></div><div class="time">3m 21s<br><button class="outline" data-a="pipeline" data-p="gitlab">View pipeline</button></div></div><div class="stages">'+ss.map(x=>'<div class="stage-row" data-a="stage" data-id="'+x[0]+'">'+dot(x[3])+'<span class="stage-name">'+x[1]+'</span><span class="duration">'+x[2]+'</span><span>'+(S.stage===x[0]?'⌃':'⌄')+'</span>'+(S.stage===x[0]?'<pre class="stage-log">'+(x[0]==='deploy'?'ERROR: deployment job exited with code 1<br>$ kubectl apply -f app.yaml<br>permission denied: cluster role<br><br>Job failed · click View pipeline for full logs':'$ pnpm '+(x[0]==='build'?'build':'test')+'<br>✓ '+(x[0]==='build'?'compiled 42 modules':'128 tests passed')+'<br>completed in '+x[2])+'</pre>':'')+'</div>').join('')+'</div></div>'}
function settings(){return '<div class="section-title"><span>Connections</span><small>Credentials stored in Keychain</small></div><div class="setting"><div class="settinghead"><div class="provider"><div class="logo">GH</div><div><div class="pname">GitHub</div><div class="repo">chenbstack · Personal access token</div></div></div><span class="badge success">Connected</span></div><div class="settingbody"><div class="field"><label>Account</label><input class="input" value="chenbstack" readonly></div><div class="field"><label>Default repository</label><input class="input" value="glint" readonly></div><div class="settingfoot"><button class="outline">Disconnect</button><button class="primary">Edit</button></div></div></div><div class="setting"><div class="settinghead"><div class="provider"><div class="logo gl">GL</div><div><div class="pname">GitLab instances</div><div class="repo">'+S.instances.length+' instances connected</div></div></div><button class="primary" data-a="add" style="padding:7px 10px;font-size:11px">'+I.plus+' Add</button></div><div class="settingbody">'+S.instances.map(x=>'<div style="display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid #b4c2dc1a">'+dot('green')+'<div style="flex:1"><div style="font-size:12px">'+safe(x.name)+'</div><div style="font-size:10px;color:var(--muted);margin-top:3px">'+safe(x.host)+' · '+safe(x.project)+'</div></div><button class="iconbtn" data-a="edit">✎</button><button class="iconbtn" data-a="remove" data-id="'+x.id+'">×</button></div>').join('')+'<div class="notice">每个实例独立保存地址、令牌和项目权限；CI 页面可在实例之间切换。</div></div></div><div class="setting"><div class="settinghead"><div><div class="pname">菜单栏行为</div><div class="repo">控制启动与通知偏好</div></div><span style="color:var(--green);font-size:11px">● Always on</span></div><div class="settingbody"><div style="display:flex;justify-content:space-between;padding-top:12px;font-size:12px"><span>登录时启动 StackHub</span><span style="color:var(--accent2)">On</span></div><div style="display:flex;justify-content:space-between;padding-top:12px;font-size:12px"><span>CI 完成时通知</span><span style="color:var(--accent2)">On</span></div></div></div>'}
function panel(){let body=S.tab==='projects'?projects():S.tab==='ci'?ci():settings();return '<section class="panel"><div class="head"><div class="brand"><span class="stack"><i></i><i></i><i></i></span><div><h2>StackHub</h2><p>Your Development Stack, One Click Away</p></div></div><div class="health">'+dot('green')+'All systems healthy</div></div><nav class="tabs">'+['projects','ci','settings'].map(x=>'<button class="tab '+(S.tab===x?'active':'')+'" data-tab="'+x+'">'+(x==='projects'?'Projects':x==='ci'?'CI':'Settings')+'</button>').join('')+'</nav>'+body+'<footer style="display:flex;justify-content:space-between;margin-top:15px"><button class="outline" data-tab="settings">'+I.settings+'&nbsp; Settings</button><button class="outline" data-a="addproject">'+I.plus+'&nbsp; Add project</button></footer></section>'}
function modal(){if(S.modal==='add')return '<div class="modalback" data-a="close"><div class="modal" onclick="event.stopPropagation()"><div class="modalhead"><div><h3>添加 GitLab 实例</h3><p>支持 GitLab.com 与自建 GitLab，令牌只保存在本机 Keychain。</p></div><button class="close" data-a="close">×</button></div><div class="modalbody"><div class="field"><label>实例名称</label><input class="input" id="name" placeholder="例如：公司 GitLab"></div><div class="field"><label>实例地址</label><input class="input" id="host" placeholder="https://gitlab.example.com"></div><div class="field"><label>Access token</label><input class="input" id="token" type="password" placeholder="glpat-••••••••"></div><div class="field"><label>默认项目（可选）</label><input class="input" id="proj" placeholder="group / project"></div><div class="settingfoot"><button class="outline" data-a="close">Cancel</button><button class="primary" data-a="save">连接实例</button></div></div></div></div>';return '<div class="modalback" data-a="close"><div class="modal" onclick="event.stopPropagation()"><div class="modalhead"><div><h3>'+(S.provider==='github'?'GitHub Actions':'GitLab CI')+' · '+(S.provider==='github'?'Build & Test':'Deploy pipeline')+'</h3><p>'+(S.provider==='github'?'glint / main · run #1842':'applyd / main · pipeline #928')+'</p></div><button class="close" data-a="close">×</button></div><div class="modalbody"><div class="pills"><div class="pill active"><strong>✓ Build</strong><span>1m 08s</span></div><div class="pill active"><strong>✓ Test</strong><span>48s</span></div><div class="pill" style="border-color:#ff6d766b"><strong style="color:var(--red)">× Deploy</strong><span>failed · 1m 25s</span></div></div><div class="logtoolbar"><span>Deploy / release job</span><span>1,284 lines · auto-scroll</span></div><pre class="logbox">2026-04-23 10:19:42  $ kubectl apply -f app.yaml<br>2026-04-23 10:19:43  namespace/applyd configured<br>2026-04-23 10:19:44  deployment.apps/api configured<br>2026-04-23 10:19:45  service/api configured<br>2026-04-23 10:19:46  ERROR: permission denied: cluster role<br>2026-04-23 10:19:46  Job failed: exit code 1<br><br>Tip: verify the runner token has deploy permission.</pre><div class="settingfoot"><button class="outline">Copy logs</button><button class="primary">Open in '+(S.provider==='github'?'GitHub':'GitLab')+'</button></div></div></div></div>'}
function render(){document.querySelector('#app').innerHTML=S.open?panel():'';if(S.modal)document.body.insertAdjacentHTML('beforeend',modal());bind()}
function bind(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;S.open=true;closeModal();render()});document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>act(b.dataset.a,b))}
function closeModal(){document.querySelectorAll('.modalback').forEach(x=>x.remove());S.modal=null}
function act(a,e){if(a==='toggle'){toast('操作已发送')};if(a==='open'){toast('正在打开服务地址…')};if(a==='restart'){toast('正在重启服务…')};if(a==='startall'){toast('正在启动所有服务…')};if(a==='glint'){toast('正在打开 Glint…')};if(a==='project'){S.projects[e.dataset.id]=!S.projects[e.dataset.id]};if(a==='instance'){S.instance=e.dataset.id};if(a==='stage'){S.stage=S.stage===e.dataset.id?null:e.dataset.id};if(a==='pipeline'){S.modal='pipeline';S.provider=e.dataset.p};if(a==='add'){S.modal='add'};if(a==='close'){closeModal()};if(a==='save'){let n=$('#name').value.trim()||'新 GitLab';let h=$('#host').value.trim()||'gitlab.example.com';let p=$('#proj').value.trim()||'未选择项目';let id='i'+Date.now();S.instances.push({id:id,name:n,host:h,project:p});S.instance=id;closeModal();S.tab='settings'};if(a==='remove'){S.instances=S.instances.filter(x=>x.id!==e.dataset.id)};render()}
function toast(t){let n=document.createElement('div');n.textContent=t;n.style='position:fixed;z-index:50;left:50%;bottom:28px;transform:translateX(-50%);padding:10px 14px;border-radius:10px;background:#2b3650;color:white;border:1px solid #c8d2ec44;font-size:12px;box-shadow:var(--shadow)';document.body.appendChild(n);setTimeout(()=>n.remove(),1100)}
$('#trigger').onclick=()=>{S.open=!S.open;$('#trigger').classList.toggle('active',S.open);render()};render();
</script></body></html>

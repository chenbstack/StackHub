<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StackHub · 主窗口设置设计稿</title>
<style>
:root{--bg:#080c15;--panel:#101725;--surface:#171f2e;--surface-2:#202a3b;--line:#ffffff14;--line-strong:#ffffff22;--text:#f5f7fb;--muted:#8c97aa;--accent:#927cff;--teal:#5ed2bd;--green:#35d276;--orange:#f4ae52;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif;color:var(--text)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#05070c;display:grid;place-items:center}button{border:0;color:inherit;font:inherit;cursor:pointer}
.panel{width:430px;height:640px;border:1px solid #ffffff20;border-radius:24px;background:var(--panel);box-shadow:0 30px 90px #0009;overflow:hidden;display:flex;flex-direction:column}
.header{display:flex;justify-content:space-between;align-items:flex-start;padding:22px 22px 15px}.brand{display:flex;gap:11px;align-items:center}.mark{width:32px;height:32px;position:relative}.mark i{position:absolute;left:2px;width:28px;height:10px;border:2px solid #b2a5ff;border-radius:4px;transform:skewY(-24deg)}.mark i:nth-child(1){top:1px}.mark i:nth-child(2){top:9px;opacity:.8}.mark i:nth-child(3){top:17px;opacity:.58}.brand h1{font-size:18px;line-height:1;margin:0}.brand p{font-size:11px;color:var(--muted);margin:5px 0 0}.health{font-size:11px;color:var(--green);display:flex;gap:7px;align-items:center;padding:8px 10px;border-radius:999px;background:#35d27615}.dot{width:8px;height:8px;border-radius:50%;background:#68758a;display:inline-block}.dot.green{background:var(--green)}.dot.orange{background:var(--orange)}
.primary-tabs{margin:0 16px 16px;padding:3px;display:grid;grid-template-columns:repeat(3,1fr);gap:3px;border:1px solid var(--line-strong);border-radius:13px;background:#080d16}.primary-tabs button{padding:9px 5px;border-radius:10px;color:var(--muted);background:transparent;font-size:12px}.primary-tabs button.active{background:#ffffff16;color:var(--text);box-shadow:inset 0 0 0 1px #ffffff0c}.content{flex:1;overflow:auto;padding:0 18px 18px}.title-row{display:flex;justify-content:space-between;align-items:flex-end;margin:2px 2px 11px}.title-row h2{font-size:16px;margin:0}.title-row span{font-size:11px;color:var(--muted)}
.settings-tabs{display:flex;gap:6px;padding:4px;margin-bottom:14px;border:1px solid var(--line);border-radius:11px;background:#080d16}.settings-tabs button{flex:1;padding:7px 4px;border-radius:8px;background:transparent;color:var(--muted);font-size:11px}.settings-tabs button.active{background:#ffffff12;color:var(--text)}
.card{border:1px solid var(--line);border-radius:15px;background:#151d2b;margin-bottom:10px;overflow:hidden}.card-head{display:flex;align-items:center;gap:10px;padding:13px}.icon{width:31px;height:31px;border-radius:9px;background:#ffffff12;display:grid;place-items:center;font-size:12px;font-weight:700}.icon.github{color:#fff}.icon.gitlab{color:#ffad67}.icon.folder{color:var(--orange)}.meta{min-width:0}.meta strong{font-size:13px}.meta small{display:block;color:var(--muted);font-size:10px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.spacer{flex:1}.badge{font-size:10px;color:var(--green);display:flex;align-items:center;gap:5px}.outline,.primary{border:1px solid var(--line-strong);border-radius:9px;padding:7px 10px;font-size:11px}.outline{background:#ffffff09}.outline:hover{background:#ffffff14}.primary{background:var(--accent);border-color:transparent;color:#fff;font-weight:600}.rows{border-top:1px solid var(--line)}.row{display:flex;align-items:center;gap:9px;padding:11px 13px;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.row .meta strong{font-size:12px;font-weight:500}.row .meta small{font-size:10px}.danger{color:#ff7d85}.section-note{font-size:10px;line-height:1.55;color:var(--muted);margin:8px 2px 13px}.empty{padding:18px 13px;color:var(--muted);font-size:11px;text-align:center}.add{width:100%;padding:10px;border-top:1px solid var(--line);background:transparent;color:var(--accent);font-size:11px}.add:hover{background:#ffffff06}.callout{display:flex;gap:10px;padding:13px;border:1px solid #5ed2bd29;border-radius:14px;background:#5ed2bd0b;color:#c2eee5;margin-bottom:10px}.callout b{font-size:11px}.callout span{display:block;color:#91bcb5;font-size:10px;margin-top:4px;line-height:1.45}.editor{border:1px solid var(--line-strong);border-radius:15px;background:#151d2b;padding:14px}.editor-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}.editor-head strong{font-size:14px}.field{margin-bottom:10px}.field label{display:block;font-size:10px;color:var(--muted);margin:0 0 5px 2px}.input{width:100%;border:1px solid var(--line-strong);border-radius:9px;background:#090e18;color:var(--text);padding:9px 10px;font:11px inherit;outline:none}.input:focus{border-color:#927cff99;box-shadow:0 0 0 3px #927cff1c}.editor-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:13px}.footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;color:var(--muted);font-size:10px}.hidden{display:none}
/* 第二版编辑布局：两列字段、明确分组、紧凑操作区。 */
.editor{padding:15px 16px;background:#151d2b;border-color:#ffffff20}
.editor-head{margin-bottom:12px}
.editor-head strong{font-size:14px;letter-spacing:-.01em}
.editor-head small{display:block;margin-top:4px;color:var(--muted);font-size:10px}
.editor-group{padding-top:2px}
.editor-group+.editor-group{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
.group-label{font-size:10px;color:#c7d0df;font-weight:600;margin:0 0 8px 2px}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{margin-bottom:0}
.field.span-2{grid-column:span 2}
.field label{display:block;font-size:10px;color:var(--muted);margin:0 0 5px 2px}
.input{padding:8px 10px}
.editor-actions{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.editor{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.editor-head,.editor-actions{grid-column:1/-1}
.editor > .field{margin-bottom:0}
.editor > .field:nth-child(3),.editor > .field:nth-child(6){grid-column:1/-1}
.editor > .field:nth-child(7){grid-column:1/-1}
.gitlab-editor{display:block;padding:16px}
.gitlab-editor .editor-head{display:flex;align-items:center;margin-bottom:16px}
.gitlab-editor .editor-head strong{font-size:14px}
.gitlab-editor .editor-head small{display:block;margin-top:4px;color:var(--muted);font-size:10px}
.gitlab-editor .editor-group{padding-top:0}
.gitlab-editor .editor-group+.editor-group{margin-top:15px;padding-top:15px}
.gitlab-editor .field-grid{grid-template-columns:1fr 1.5fr}
.gitlab-editor .credential-row{display:grid;grid-template-columns:32px minmax(0,1fr) 220px;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:#090e18}
.gitlab-editor .credential-icon{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:#ffad671b;color:#ffad67;font-size:11px;font-weight:700}
.gitlab-editor .credential-row .input{padding:8px 9px}
.gitlab-editor .editor-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:16px;padding-top:13px;border-top:1px solid var(--line)}
.connection-editor{display:block;padding:0;border:0;background:transparent}
.connection-editor .connection-hero{display:flex;align-items:center;gap:11px;padding:13px 2px 15px;border-bottom:1px solid var(--line)}
.connection-editor .connection-icon{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:#ffad671b;color:#ffad67;font-size:13px;font-weight:700;box-shadow:inset 0 0 0 1px #ffad6724}
.connection-editor .connection-hero strong{font-size:14px}.connection-editor .connection-hero small{display:block;color:var(--muted);font-size:10px;margin-top:3px}
.connection-editor .connection-status{margin-left:auto;display:flex;align-items:center;gap:5px;color:var(--green);font-size:10px;padding:6px 8px;border-radius:999px;background:#35d27612}
.connection-editor .connection-section{padding:14px 2px 2px}.connection-editor .connection-section+.connection-section{border-top:1px solid var(--line);margin-top:11px}
.connection-editor .connection-section-title{font-size:10px;color:#c7d0df;font-weight:600;margin-bottom:9px}
.connection-editor .connection-field{display:grid;grid-template-columns:88px minmax(0,1fr);align-items:center;gap:10px;margin-bottom:9px}.connection-editor .connection-field:last-child{margin-bottom:0}
.connection-editor .connection-field label{font-size:10px;color:var(--muted);margin:0}.connection-editor .connection-field .input{padding:8px 10px}
.connection-editor .token-row{display:grid;grid-template-columns:28px minmax(0,1fr);gap:9px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:11px;background:#090e18}.connection-editor .token-row .token-mark{width:27px;height:27px;border-radius:8px;display:grid;place-items:center;background:#ffad671b;color:#ffad67;font-size:10px;font-weight:700}.connection-editor .token-meta strong{display:block;font-size:11px}.connection-editor .token-meta small{display:block;color:var(--muted);font-size:9px;margin-top:3px}.connection-editor .token-input{grid-column:2;width:100%;margin-top:-2px}
.connection-editor .editor-actions{align-items:center;justify-content:space-between;margin-top:16px;padding:13px 2px 0;border-top:1px solid var(--line)}.connection-editor .editor-actions .action-note{font-size:9px;color:var(--muted)}
</style>
</head>
<body>
<main class="panel">
  <header class="header"><div class="brand"><span class="mark"><i></i><i></i><i></i></span><div><h1>StackHub</h1><p>开发工作台</p></div></div><div class="health"><span class="dot green"></span>健康</div></header>
  <nav class="primary-tabs" id="primaryTabs"><button class="active" data-main="projects">项目</button><button data-main="ci">CI</button><button data-main="settings">设置</button></nav>
  <section class="content" id="view"></section>
  <footer class="footer"><span>StackHub · 菜单栏</span><span>⌘ , 设置</span></footer>
</main>
<script>
const state={main:'settings',sub:'projects',editor:null,editingInstance:null,project:{name:'Glint',directory:'~/Code/glint',service:'frontend',command:'pnpm dev',url:'http://localhost:3000'},gitlabs:[{id:'public',name:'GitLab.com',host:'https://gitlab.com'},{id:'corp',name:'公司 GitLab',host:'https://gitlab.intra.example.com'}]};
const icon={folder:'▣',github:'GH',gitlab:'GL'};
const view=document.querySelector('#view');
function header(title,detail){return `<div class="title-row"><h2>${title}</h2><span>${detail}</span></div>`}
function settingsTabs(){return `<div class="settings-tabs">${[['projects','本地项目'],['github','GitHub'],['gitlab','GitLab']].map(([id,label])=>`<button class="${state.sub===id?'active':''}" data-sub="${id}">${label}</button>`).join('')}</div>`}
function projectEditor(){let p=state.project;return header(state.editor==='newProject'?'添加项目':'编辑项目','所有修改都在当前面板完成')+`<section class="editor"><div class="editor-head"><strong>${state.editor==='newProject'?'新建本地项目':'项目配置'}</strong><button class="outline" data-action="cancel">取消</button></div><div class="field"><label>项目名称</label><input class="input" id="projectName" value="${state.editor==='newProject'?'':p.name}"></div><div class="field"><label>工作目录</label><input class="input" id="projectDirectory" value="${state.editor==='newProject'?'':p.directory}"></div><div class="field"><label>服务名称</label><input class="input" id="serviceName" value="${state.editor==='newProject'?'':p.service}"></div><div class="field"><label>启动命令</label><input class="input" id="command" value="${state.editor==='newProject'?'':p.command}"></div><div class="field"><label>访问地址（可选）</label><input class="input" id="serviceURL" value="${state.editor==='newProject'?'':p.url}"></div><div class="editor-actions"><button class="outline" data-action="cancel">取消</button><button class="primary" data-action="saveProject">保存项目</button></div></section>`}
function gitlabEditor(){let item=state.gitlabs.find(x=>x.id===state.editingInstance);let fresh=!item;let name=item?.name||'';let host=item?.host||'';return header(fresh?'添加 GitLab':'编辑 GitLab','更新连接信息')+`<section class="editor connection-editor"><div class="connection-hero"><span class="connection-icon">GL</span><div><strong>${fresh?'新 GitLab 实例':name}</strong><small>${fresh?'配置后即可同步流水线':host}</small></div><span class="connection-status"><span class="dot ${fresh?'orange':'green'}"></span>${fresh?'待连接':'已连接'}</span></div><div class="connection-section"><div class="connection-section-title">实例信息</div><div class="connection-field"><label for="gitlabName">显示名称</label><input class="input" id="gitlabName" value="${name}" placeholder="例如：公司 GitLab"></div><div class="connection-field"><label for="gitlabHost">实例地址</label><input class="input" id="gitlabHost" value="${host}" placeholder="https://gitlab.example.com"></div></div><div class="connection-section"><div class="connection-section-title">授权凭据</div><div class="token-row"><span class="token-mark">GL</span><div class="token-meta"><strong>Access Token</strong><small>${fresh?'用于读取项目与流水线':'留空则保留当前 Token'}</small></div><input class="input token-input" id="gitlabToken" type="password" placeholder="${fresh?'glpat-••••••••':'留空则不修改'}"></div></div><div class="editor-actions"><span class="action-note">凭据仅保存到本机钥匙串</span><span><button class="outline" data-action="cancel">取消</button> <button class="primary" data-action="saveGitLab">${fresh?'连接实例':'保存修改'}</button></span></div></section>`}
function githubEditor(){return header('管理 GitHub 授权','内联编辑，不打开新窗口')+`<section class="editor"><div class="editor-head"><strong>Personal Access Token</strong><button class="outline" data-action="cancel">取消</button></div><div class="field"><label>当前账号</label><input class="input" value="chenbstack" readonly></div><div class="field"><label>新 Token</label><input class="input" id="githubToken" type="password" placeholder="留空则保持当前授权"></div><div class="editor-actions"><button class="outline danger" data-action="disconnectGitHub">断开授权</button><button class="primary" data-action="saveGitHub">保存授权</button></div></section>`}
function projects(){if(state.editor==='project'||state.editor==='newProject')return projectEditor();let p=state.project;return header('项目','本机服务')+`<p class="section-note">本地项目只负责启动和停止本机服务，与远端 CI 项目完全分离。</p><article class="card"><div class="card-head"><span class="icon folder">${icon.folder}</span><div class="meta"><strong>${p.name}</strong><small>${p.directory} · 2 个服务</small></div><span class="badge"><span class="dot green"></span>运行中</span><button class="outline" data-action="editProject">编辑</button></div><div class="rows"><div class="row"><span class="dot green"></span><div class="meta"><strong>${p.service}</strong><small>${p.command} · localhost:3000</small></div><button class="outline">停止</button></div><div class="row"><span class="dot"></span><div class="meta"><strong>worker</strong><small>pnpm worker · 已停止</small></div><button class="outline">启动</button></div></div></article><button class="add" data-action="newProject">＋ 添加本地项目</button>`}
function github(){if(state.editor==='github')return githubEditor();return header('GitHub','授权管理')+`<p class="section-note">连接后同步你有权限访问的仓库、Actions 运行记录和作业日志。</p><article class="card"><div class="card-head"><span class="icon github">${icon.github}</span><div class="meta"><strong>GitHub</strong><small>Personal Access Token</small></div><span class="badge"><span class="dot green"></span>已连接</span></div><div class="rows"><div class="row"><div class="meta"><strong>当前账号</strong><small>chenbstack</small></div><div class="spacer"></div><button class="outline" data-action="editGitHub">管理授权</button></div><div class="row"><div class="meta"><strong>安全存储</strong><small>Token 保存在 macOS 钥匙串</small></div><div class="spacer"></div><span style="color:var(--green);font-size:10px">安全</span></div></div></article><div class="callout"><span>✓</span><div><b>按需同步</b><span>CI 页面只拉取可访问项目的最近活动，不影响本地项目页。</span></div></div>`}
function gitlab(){if(state.editor==='gitlab')return gitlabEditor();return header('GitLab','多实例授权')+`<p class="section-note">支持 GitLab.com 和多个自建 GitLab 实例，每个实例独立保存 Token。</p><article class="card"><div class="card-head"><span class="icon gitlab">${icon.gitlab}</span><div class="meta"><strong>已连接实例</strong><small>${state.gitlabs.length} 个实例 · 独立权限</small></div></div><div class="rows">${state.gitlabs.map(x=>`<div class="row"><span class="dot green"></span><div class="meta"><strong>${x.name}</strong><small>${x.host}</small></div><div class="spacer"></div><button class="outline" data-action="editGitLab" data-id="${x.id}">编辑</button><button class="outline danger" data-action="removeGitLab" data-id="${x.id}">移除</button></div>`).join('')}</div><button class="add" data-action="newGitLab">＋ 添加 GitLab 实例</button></article>`}
function handleAction(button){let action=button.dataset.action;if(action==='editProject')state.editor='project';if(action==='newProject')state.editor='newProject';if(action==='editGitHub')state.editor='github';if(action==='editGitLab'){state.editor='gitlab';state.editingInstance=button.dataset.id}if(action==='newGitLab'){state.editor='gitlab';state.editingInstance=null}if(action==='cancel')state.editor=null;if(action==='saveProject'){state.project={name:document.querySelector('#projectName').value||'未命名项目',directory:document.querySelector('#projectDirectory').value||'~/Code/project',service:document.querySelector('#serviceName').value||'服务',command:document.querySelector('#command').value||'pnpm dev',url:document.querySelector('#serviceURL').value};state.editor=null}if(action==='saveGitLab'){let name=document.querySelector('#gitlabName').value||'新 GitLab';let host=document.querySelector('#gitlabHost').value||'https://gitlab.example.com';if(state.editingInstance){let item=state.gitlabs.find(x=>x.id===state.editingInstance);item.name=name;item.host=host}else state.gitlabs.push({id:'i'+Date.now(),name,host});state.editor=null}if(action==='removeGitLab')state.gitlabs=state.gitlabs.filter(x=>x.id!==button.dataset.id);if(action==='saveGitHub'||action==='disconnectGitHub')state.editor=null;render()}
function render(){document.querySelectorAll('[data-main]').forEach(b=>b.classList.toggle('active',b.dataset.main===state.main));if(state.main==='settings'){view.innerHTML=settingsTabs()+(state.sub==='projects'?projects():state.sub==='github'?github():gitlab())}else{view.innerHTML=header(state.main==='projects'?'项目':'CI',state.main==='projects'?'本机服务':'最近活动')+`<article class="card"><div class="empty">${state.main==='projects'?'项目页保留原有服务卡片展示。':'CI 页保留关注项目与全部流水线展示。'}</div></article>`}document.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{state.sub=b.dataset.sub;state.editor=null;render()});document.querySelectorAll('[data-main]').forEach(b=>b.onclick=()=>{state.main=b.dataset.main;state.editor=null;render()});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>handleAction(b))}
render();
</script>
</body>
</html>

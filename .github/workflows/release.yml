name: Release StackHub

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build macOS release
    runs-on: macos-14

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate version tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Version tags must use vMAJOR.MINOR.PATCH, for example v0.1.0." >&2
            exit 1
          fi

          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build release executable
        working-directory: swift-prototype
        run: swift build -c release

      - name: Assemble and verify app bundle
        shell: bash
        run: |
          app_path="release/StackHub.app"
          archive_path="release/StackHub-${VERSION}-macos-arm64.zip"

          mkdir -p "$app_path/Contents/MacOS"
          cp swift-prototype/.build/release/StackHub "$app_path/Contents/MacOS/StackHub"
          cp swift-prototype/Packaging/Info.plist "$app_path/Contents/Info.plist"

          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$app_path/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" "$app_path/Contents/Info.plist"

          codesign --force --deep --sign - "$app_path"
          codesign --verify --deep --strict "$app_path"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "$archive_path"
          shasum -a 256 "$archive_path"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          archive_path="release/StackHub-${VERSION}-macos-arm64.zip"
          asset_label="StackHub-${VERSION}-macos-arm64.zip"

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$archive_path#$asset_label" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$archive_path#$asset_label" \
              --title "StackHub $VERSION" \
              --generate-notes
          fi
